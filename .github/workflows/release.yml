name: Build Release ZIP

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/release-v1.0.0.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build addon ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/TinkerBox-v${{ steps.version.outputs.version }}.zip" TinkerBox \
            -x "*/.DS_Store" "*/Thumbs.db"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: 97ad9e91f05e9497e7adfb7d1523febea9bf12ad
          name: TinkerBox v${{ steps.version.outputs.version }}
          body: |
            ## TinkerBox v1.0.0

            Initial public release of TinkerBox for World of Warcraft Retail / Midnight.

            ### Highlights
            - FarmTracker with sessions, favorites and history
            - CraftingList with recipe tracking and shopping list
            - GoldKasse with daily tracking, sessions and history
            - Zusatzinfos with total gold and character overview
            - TinkerNotes with multiple saved notes
            - Custom minimap button
            - Configurable UI and settings
          files: dist/TinkerBox-v${{ steps.version.outputs.version }}.zip
