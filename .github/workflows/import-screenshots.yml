name: Import TinkerBox Screenshots

on:
  push:
    paths:
      - 'TinkerBox-Screenshots.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import screenshots
        shell: bash
        run: |
          if [ ! -f TinkerBox-Screenshots.zip ]; then
            echo "Screenshot ZIP already removed; nothing to import."
            exit 0
          fi

          unzip -o TinkerBox-Screenshots.zip -d .
          rm TinkerBox-Screenshots.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add TinkerBox screenshots"
          git push
