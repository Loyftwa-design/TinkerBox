name: Import TinkerBox ZIP

on:
  push:
    paths:
      - 'TinkerBox-v1.0.0.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import addon source
        shell: bash
        run: |
          if [ ! -f TinkerBox-v1.0.0.zip ]; then
            echo "ZIP already removed; nothing to import."
            exit 0
          fi

          rm -rf TinkerBox
          unzip -o TinkerBox-v1.0.0.zip -d .
          rm TinkerBox-v1.0.0.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import complete TinkerBox v1.0.0 source and assets"
          git push
